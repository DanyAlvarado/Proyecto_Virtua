version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: trip_planner_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
    networks:
      trip_network:
        ipv4_address: 10.21.21.30

  backend:
    build: ./backend
    container_name: trip_planner_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5572:5572"
    networks:
      trip_network:
        ipv4_address: 10.21.21.20
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: trip_planner_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      trip_network:
        ipv4_address: 10.21.21.10
    depends_on:
      - backend

volumes:
  mongo_data:
    name: trip_planner_vol

networks:
  trip_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.21.0/24